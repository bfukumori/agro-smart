name: AgroSmart CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  code-quality-and-lint:
    name: 1. Qualidade de Código (Linting & Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Linter
        run: pip install flake8

      - name: Executar Análise de Conformidade PEP 8
        run: flake8 src tests --max-line-length=120

  security-sast:
    name: 2. Segurança Estática (SAST - Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Executar SAST no Código Fonte
        run: bandit -r src -ll -ii

  security-sca:
    name: 3. Análise de Vulnerabilidades em Dependências (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ferramenta de Auditoria
        run: pip install pip-audit

      - name: Auditar Vulnerabilidades em Pacotes
        run: pip-audit --desc || true

  unit-tests:
    name: 4. Testes Automatizados & Validação de Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependências de Visualização e Teste
        run: pip install matplotlib pillow

      - name: Executar Bateria de Testes Unitários
        run: python -m unittest discover -s tests -v

  container-build-and-healthcheck:
    name: 5. Build do Container & Verificação de Saúde
    runs-on: ubuntu-latest
    needs: [code-quality-and-lint, security-sast, unit-tests]
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker AgroSmart
        run: docker build -t agrosmart:fase7 .

      - name: Iniciar Container e Testar Healthcheck
        run: |
          docker compose up -d
          sleep 5
          docker compose ps
          docker ps --filter "name=agrosmart" --format "{{.Status}}"
          curl --fail http://localhost:8080/ || exit 1
          docker compose stop
